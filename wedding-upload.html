<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex, nofollow">
  <title>Share Your Photos</title>
  <link rel="icon" type="image/x-icon" href="Websitelogo.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    /* ── Design Tokens (mirrored from main site) ── */
    :root {
      --font-heading: 'Playfair Display', serif;
      --font-body: 'Outfit', sans-serif;
      --text-dark: #1a1a2e;
      --text-light: #ffffff;
      --text-muted: #4a4a6a;
      --accent: #d4af37;
      --accent-hover: #f1c40f;
      --glass-bg: rgba(255, 255, 255, 0.72);
      --glass-border: rgba(255, 255, 255, 0.35);
      --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
      --glass-blur: blur(18px);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: var(--font-body);
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 24px 16px;
      position: relative;
    }

    /* ── Animated background particles ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(2px 2px at 20% 30%, rgba(212, 175, 55, 0.4), transparent),
        radial-gradient(2px 2px at 40% 70%, rgba(212, 175, 55, 0.3), transparent),
        radial-gradient(1px 1px at 60% 20%, rgba(255, 255, 255, 0.3), transparent),
        radial-gradient(2px 2px at 80% 50%, rgba(212, 175, 55, 0.25), transparent),
        radial-gradient(1px 1px at 10% 80%, rgba(255, 255, 255, 0.25), transparent),
        radial-gradient(1px 1px at 70% 85%, rgba(212, 175, 55, 0.35), transparent),
        radial-gradient(2px 2px at 50% 10%, rgba(255, 255, 255, 0.2), transparent),
        radial-gradient(1px 1px at 90% 15%, rgba(212, 175, 55, 0.3), transparent);
      background-size: 200% 200%;
      animation: shimmer 20s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes shimmer {
      0%   { background-position: 0% 0%; }
      100% { background-position: 100% 100%; }
    }

    /* ── Card ── */
    .upload-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      box-shadow: var(--glass-shadow);
      padding: 48px 32px 40px;
      text-align: center;
      animation: cardEntry 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes cardEntry {
      from { opacity: 0; transform: translateY(40px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ── Decorative ring icon ── */
    .icon-rings {
      font-size: 3rem;
      margin-bottom: 8px;
      display: block;
      animation: ringPulse 3s ease-in-out infinite;
    }

    @keyframes ringPulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.08); }
    }

    .upload-card h1 {
      font-family: var(--font-heading);
      font-size: 2rem;
      color: var(--text-dark);
      margin-bottom: 8px;
      font-weight: 700;
    }

    .upload-card .subtitle {
      font-size: 1.05rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 32px;
      font-weight: 300;
    }

    /* ── Drop zone ── */
    .drop-zone {
      border: 2px dashed rgba(212, 175, 55, 0.5);
      border-radius: 20px;
      padding: 40px 20px;
      cursor: pointer;
      transition: all 0.3s ease;
      background: rgba(212, 175, 55, 0.04);
      position: relative;
    }

    .drop-zone:hover,
    .drop-zone.drag-over {
      border-color: var(--accent);
      background: rgba(212, 175, 55, 0.1);
      transform: scale(1.02);
    }

    .drop-zone-icon {
      font-size: 2.6rem;
      margin-bottom: 12px;
      display: block;
    }

    .drop-zone-text {
      font-size: 1.1rem;
      color: var(--text-dark);
      font-weight: 500;
    }

    .drop-zone-hint {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 6px;
    }

    #file-input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    /* ── Preview ── */
    .preview-area {
      display: none;
      margin-top: 24px;
      animation: fadeUp 0.4s ease both;
    }

    .preview-area.visible { display: block; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .preview-thumb {
      width: 100%;
      max-height: 260px;
      object-fit: cover;
      border-radius: 16px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.15);
    }

    .file-name {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 10px;
      word-break: break-all;
    }

    /* ── Upload button ── */
    .upload-btn {
      display: none;
      width: 100%;
      margin-top: 24px;
      padding: 16px 32px;
      font-family: var(--font-body);
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--text-dark);
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(212, 175, 55, 0.35);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .upload-btn.visible { display: block; }

    .upload-btn:hover:not(:disabled) {
      transform: translateY(-3px);
      box-shadow: 0 8px 30px rgba(212, 175, 55, 0.5);
    }

    .upload-btn:active:not(:disabled) {
      transform: translateY(-1px);
    }

    .upload-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    /* ── Spinner ── */
    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(26, 26, 46, 0.2);
      border-top-color: var(--text-dark);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ── Status messages ── */
    .status-msg {
      display: none;
      margin-top: 24px;
      padding: 16px 20px;
      border-radius: 16px;
      font-size: 1rem;
      font-weight: 500;
      animation: fadeUp 0.5s ease both;
    }

    .status-msg.visible { display: block; }

    .status-msg.success {
      background: rgba(39, 174, 96, 0.12);
      color: #1e8449;
      border: 1px solid rgba(39, 174, 96, 0.25);
    }

    .status-msg.error {
      background: rgba(231, 76, 60, 0.12);
      color: #c0392b;
      border: 1px solid rgba(231, 76, 60, 0.25);
    }

    .status-icon {
      font-size: 1.3rem;
      margin-right: 6px;
      vertical-align: middle;
    }

    /* ── "Upload another" link ── */
    .reset-link {
      display: none;
      margin-top: 16px;
      font-size: 0.95rem;
      color: var(--accent);
      text-decoration: underline;
      cursor: pointer;
      font-weight: 500;
      transition: color 0.2s;
    }

    .reset-link.visible { display: inline-block; }
    .reset-link:hover { color: var(--accent-hover); }

    /* ── Footer ── */
    .card-footer {
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid rgba(0, 0, 0, 0.06);
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 300;
    }

    /* ── Responsive ── */
    @media (max-width: 520px) {
      .upload-card {
        padding: 36px 20px 32px;
        border-radius: 22px;
      }
      .upload-card h1 { font-size: 1.7rem; }
      .drop-zone { padding: 32px 16px; }
    }
  </style>
</head>

<body>
  <div class="upload-card">
    <span class="icon-rings" aria-hidden="true">💍</span>
    <h1>Share Your Photos</h1>
    <p class="subtitle">
      Snap a photo or choose one from your library — we'd love to see the day through your eyes!
    </p>

    <!-- Drop zone / file picker -->
    <div class="drop-zone" id="drop-zone">
      <span class="drop-zone-icon" aria-hidden="true">📸</span>
      <p class="drop-zone-text">Tap to take or choose a photo</p>
      <p class="drop-zone-hint">or drag & drop an image here</p>
      <input
        type="file"
        id="file-input"
        accept="image/*"
        capture="environment"
        aria-label="Select a photo to upload"
      >
    </div>

    <!-- Image preview -->
    <div class="preview-area" id="preview-area">
      <img class="preview-thumb" id="preview-img" alt="Preview of selected photo">
      <p class="file-name" id="file-name"></p>
    </div>

    <!-- Upload action -->
    <button class="upload-btn" id="upload-btn" type="button">
      Upload Photo
    </button>

    <!-- Status feedback -->
    <div class="status-msg" id="status-msg"></div>

    <!-- Reset -->
    <span class="reset-link" id="reset-link">Upload another photo</span>

    <div class="card-footer">
      With love — thank you for celebrating with us! 🤍
    </div>
  </div>

  <script>
    // ═══════════════════════════════════════════════════════
    // CONFIGURATION — Replace with your deployed Apps Script URL
    // ═══════════════════════════════════════════════════════
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx3smHc0KP5l_1NYHE6Pfwm75NsDNWSLL3bEMdfQQD-HRxHK4oVxcJ3mQTKPiEQXEDBFQ/exec';

    // Maximum dimension (width or height) for the resized image
    const MAX_IMAGE_DIMENSION = 2048;

    // JPEG quality for the resized output (0.0 – 1.0)
    const JPEG_QUALITY = 0.85;

    // ═══════════════════════════════════════════════════════
    // DOM References
    // ═══════════════════════════════════════════════════════
    const dropZone    = document.getElementById('drop-zone');
    const fileInput   = document.getElementById('file-input');
    const previewArea = document.getElementById('preview-area');
    const previewImg  = document.getElementById('preview-img');
    const fileNameEl  = document.getElementById('file-name');
    const uploadBtn   = document.getElementById('upload-btn');
    const statusMsg   = document.getElementById('status-msg');
    const resetLink   = document.getElementById('reset-link');

    let selectedFile = null;

    // ═══════════════════════════════════════════════════════
    // Drag & Drop Handlers
    // ═══════════════════════════════════════════════════════
    ['dragenter', 'dragover'].forEach(evt => {
      dropZone.addEventListener(evt, e => {
        e.preventDefault();
        dropZone.classList.add('drag-over');
      });
    });

    ['dragleave', 'drop'].forEach(evt => {
      dropZone.addEventListener(evt, e => {
        e.preventDefault();
        dropZone.classList.remove('drag-over');
      });
    });

    dropZone.addEventListener('drop', e => {
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) {
        handleFileSelect(file);
      }
    });

    // ═══════════════════════════════════════════════════════
    // File Selection
    // ═══════════════════════════════════════════════════════
    fileInput.addEventListener('change', () => {
      if (fileInput.files.length > 0) {
        handleFileSelect(fileInput.files[0]);
      }
    });

    function handleFileSelect(file) {
      selectedFile = file;

      // Show preview
      const reader = new FileReader();
      reader.onload = e => {
        previewImg.src = e.target.result;
        previewArea.classList.add('visible');
        fileNameEl.textContent = file.name;
        uploadBtn.classList.add('visible');
        statusMsg.classList.remove('visible');
        resetLink.classList.remove('visible');
      };
      reader.readAsDataURL(file);
    }

    // ═══════════════════════════════════════════════════════
    // Image Resize via Canvas
    // Scales the image so the longest side ≤ MAX_IMAGE_DIMENSION
    // Returns a Base64 string (without the data:… prefix)
    // ═══════════════════════════════════════════════════════
    function resizeAndEncode(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;

          // Only scale down, never up
          if (width > MAX_IMAGE_DIMENSION || height > MAX_IMAGE_DIMENSION) {
            const ratio = Math.min(MAX_IMAGE_DIMENSION / width, MAX_IMAGE_DIMENSION / height);
            width  = Math.round(width * ratio);
            height = Math.round(height * ratio);
          }

          const canvas = document.createElement('canvas');
          canvas.width  = width;
          canvas.height = height;

          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          // Export as JPEG data URL, then strip the prefix
          const dataUrl = canvas.toDataURL('image/jpeg', JPEG_QUALITY);
          const base64  = dataUrl.split(',')[1];
          resolve(base64);
        };
        img.onerror = () => reject(new Error('Failed to load image for resizing.'));
        img.src = URL.createObjectURL(file);
      });
    }

    // ═══════════════════════════════════════════════════════
    // Upload Handler
    // ═══════════════════════════════════════════════════════
    uploadBtn.addEventListener('click', async () => {
      if (!selectedFile) return;

      // UI → loading state
      uploadBtn.disabled = true;
      uploadBtn.innerHTML = '<span class="spinner"></span> Uploading…';
      statusMsg.classList.remove('visible');

      try {
        const base64Data = await resizeAndEncode(selectedFile);

        const payload = {
          filename: selectedFile.name,
          mimeType: 'image/jpeg',       // Always JPEG after canvas resize
          data: base64Data
        };

        // CRITICAL: Use text/plain to avoid CORS preflight with Apps Script
        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload),
          redirect: 'follow'            // Apps Script redirects on deploy
        });

        const result = await response.json();

        if (result.status === 'success') {
          showStatus('success', '✨ Photo uploaded — thank you!');
          dropZone.style.display = 'none';
          previewArea.classList.remove('visible');
          uploadBtn.classList.remove('visible');
          resetLink.classList.add('visible');
        } else {
          showStatus('error', `Something went wrong: ${result.message || 'Unknown error'}`);
        }
      } catch (err) {
        console.error('Upload failed:', err);
        showStatus('error', 'Upload failed — please check your connection and try again.');
      } finally {
        uploadBtn.disabled = false;
        uploadBtn.innerHTML = 'Upload Photo';
      }
    });

    // ═══════════════════════════════════════════════════════
    // Status & Reset
    // ═══════════════════════════════════════════════════════
    function showStatus(type, message) {
      const icon = type === 'success' ? '✅' : '⚠️';
      statusMsg.className = `status-msg visible ${type}`;
      statusMsg.innerHTML = `<span class="status-icon">${icon}</span> ${message}`;
    }

    resetLink.addEventListener('click', () => {
      // Reset everything for another upload
      selectedFile = null;
      fileInput.value = '';
      previewImg.src = '';
      previewArea.classList.remove('visible');
      uploadBtn.classList.remove('visible');
      statusMsg.classList.remove('visible');
      resetLink.classList.remove('visible');
      dropZone.style.display = '';
    });
  </script>
</body>

</html>
