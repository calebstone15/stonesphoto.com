<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex, nofollow">
  <title>Share Your Photos</title>
  <link rel="icon" type="image/x-icon" href="Websitelogo.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-heading: 'Playfair Display', serif;
      --font-body: 'Outfit', sans-serif;
      --text-dark: #2c3e50;
      --text-light: #ffffff;
      --text-muted: #6b8299;
      --accent: #8badc4;           /* Dusty blue */
      --accent-dark: #5f8ea8;      /* Deeper blue for hover */
      --gold: #c9a84c;             /* Warm gold */
      --gold-hover: #dbbe5e;
      --ivory: #faf8f5;
      --glass-bg: rgba(250, 248, 245, 0.82);
      --glass-border: rgba(255, 255, 255, 0.6);
      --glass-shadow: 0 8px 32px rgba(44, 62, 80, 0.12);
      --glass-blur: blur(18px);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: var(--font-body);
      background: linear-gradient(160deg, #d4e4ed 0%, #a7c7d7 35%, #8badc4 65%, #c6d8e3 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 24px 16px;
      position: relative;
    }

    /* ── Animated background particles ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(2px 2px at 20% 30%, rgba(201, 168, 76, 0.35), transparent),
        radial-gradient(2px 2px at 40% 70%, rgba(255, 255, 255, 0.5), transparent),
        radial-gradient(1px 1px at 60% 20%, rgba(255, 255, 255, 0.4), transparent),
        radial-gradient(2px 2px at 80% 50%, rgba(201, 168, 76, 0.25), transparent),
        radial-gradient(1px 1px at 10% 80%, rgba(255, 255, 255, 0.35), transparent),
        radial-gradient(1px 1px at 70% 85%, rgba(201, 168, 76, 0.3), transparent),
        radial-gradient(2px 2px at 50% 10%, rgba(255, 255, 255, 0.3), transparent),
        radial-gradient(1px 1px at 90% 15%, rgba(201, 168, 76, 0.25), transparent);
      background-size: 200% 200%;
      animation: shimmer 20s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes shimmer {
      0%   { background-position: 0% 0%; }
      100% { background-position: 100% 100%; }
    }

    /* ── Card ── */
    .upload-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      box-shadow: var(--glass-shadow);
      padding: 48px 28px 40px;
      text-align: center;
      animation: cardEntry 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes cardEntry {
      from { opacity: 0; transform: translateY(40px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .icon-rings {
      font-size: 3rem;
      margin-bottom: 8px;
      display: block;
      animation: ringPulse 3s ease-in-out infinite;
    }

    @keyframes ringPulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.08); }
    }

    .upload-card h1 {
      font-family: var(--font-heading);
      font-size: 2rem;
      color: var(--text-dark);
      margin-bottom: 8px;
      font-weight: 700;
    }

    .upload-card .subtitle {
      font-size: 1.05rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 32px;
      font-weight: 300;
    }

    /* ── Big select button ── */
    .select-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 20px 24px;
      font-family: var(--font-body);
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text-light);
      background: var(--accent-dark);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(95, 142, 168, 0.35);
      transition: all 0.3s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .select-btn:active {
      transform: scale(0.97);
    }

    .select-btn .btn-icon {
      font-size: 1.5rem;
    }


    /* Hidden file input */
    #file-input {
      display: none;
    }

    /* ── Thumbnail grid ── */
    .preview-grid {
      display: none;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 24px;
    }

    .preview-grid.visible {
      display: grid;
    }

    .thumb-wrapper {
      position: relative;
      aspect-ratio: 1;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
    }

    .thumb-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Per-photo status overlay */
    .thumb-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.45);
      opacity: 0;
      transition: opacity 0.3s ease;
      border-radius: 14px;
    }

    .thumb-overlay.uploading,
    .thumb-overlay.done,
    .thumb-overlay.failed {
      opacity: 1;
    }

    .thumb-overlay .overlay-icon {
      font-size: 1.8rem;
    }

    /* Thumbnail spinner */
    .thumb-spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Remove button on each thumb */
    .thumb-remove {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: none;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 1rem;
      line-height: 26px;
      text-align: center;
      cursor: pointer;
      z-index: 2;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.2s;
    }

    .thumb-remove:hover { background: rgba(200, 50, 50, 0.8); }

    .photo-count {
      display: none;
      margin-top: 16px;
      font-size: 0.95rem;
      color: var(--text-muted);
      font-weight: 400;
    }

    .photo-count.visible { display: block; }

    /* ── Upload button ── */
    .upload-btn {
      display: none;
      width: 100%;
      margin-top: 20px;
      padding: 18px 32px;
      font-family: var(--font-body);
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text-dark);
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-hover) 100%);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(201, 168, 76, 0.35);
      transition: all 0.3s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .upload-btn.visible { display: block; }

    .upload-btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    .upload-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    /* ── Inline spinner for upload button ── */
    .btn-spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(26, 26, 46, 0.2);
      border-top-color: var(--text-dark);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    /* ── Progress bar ── */
    .progress-bar-wrapper {
      display: none;
      margin-top: 16px;
      background: rgba(0, 0, 0, 0.08);
      border-radius: 20px;
      height: 8px;
      overflow: hidden;
    }

    .progress-bar-wrapper.visible { display: block; }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent-dark));
      border-radius: 20px;
      transition: width 0.4s ease;
    }

    /* ── Status messages ── */
    .status-msg {
      display: none;
      margin-top: 20px;
      padding: 16px 20px;
      border-radius: 16px;
      font-size: 1rem;
      font-weight: 500;
      animation: fadeUp 0.5s ease both;
    }

    .status-msg.visible { display: block; }

    .status-msg.success {
      background: rgba(39, 174, 96, 0.12);
      color: #1e8449;
      border: 1px solid rgba(39, 174, 96, 0.25);
    }

    .status-msg.error {
      background: rgba(231, 76, 60, 0.12);
      color: #c0392b;
      border: 1px solid rgba(231, 76, 60, 0.25);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Reset link ── */
    .reset-link {
      display: none;
      margin-top: 16px;
      font-size: 0.95rem;
      color: var(--accent-dark);
      text-decoration: underline;
      cursor: pointer;
      font-weight: 500;
      transition: color 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .reset-link.visible { display: inline-block; }
    .reset-link:hover { color: var(--gold); }

    /* ── Gallery link ── */
    .gallery-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      margin-top: 16px;
      padding: 16px 24px;
      font-family: var(--font-body);
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--accent-dark);
      background: transparent;
      border: 2px solid var(--accent);
      border-radius: 50px;
      text-decoration: none;
      transition: all 0.3s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .gallery-link:active {
      transform: scale(0.97);
    }

    .gallery-link .link-icon {
      font-size: 1.2rem;
    }

    /* ── Footer ── */
    .card-footer {
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid rgba(0, 0, 0, 0.06);
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 300;
    }

    /* ── Responsive ── */
    @media (max-width: 520px) {
      .upload-card {
        padding: 36px 18px 32px;
        border-radius: 22px;
      }
      .upload-card h1 { font-size: 1.7rem; }
    }

    @media (max-width: 360px) {
      .preview-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>

<body>
  <div class="upload-card">
    <span class="icon-rings" aria-hidden="true">💍</span>
    <h1>Gunner & Perla</h1>
    <p class="subtitle">
      Share your photos from our special day — we'd love to see it through your eyes!
    </p>

    <!-- Big select button -->
    <button class="select-btn" id="select-btn" type="button">
      <span class="btn-icon" aria-hidden="true">📸</span>
      Choose Photos
    </button>


    <!-- Hidden file input — no capture so it opens photo library picker -->
    <input
      type="file"
      id="file-input"
      accept="image/*"
      multiple
      aria-label="Select photos to upload"
    >

    <!-- Thumbnail grid preview -->
    <div class="preview-grid" id="preview-grid"></div>
    <p class="photo-count" id="photo-count"></p>

    <!-- Upload action -->
    <button class="upload-btn" id="upload-btn" type="button">
      Upload Photos
    </button>

    <!-- Progress bar -->
    <div class="progress-bar-wrapper" id="progress-wrapper">
      <div class="progress-bar-fill" id="progress-fill"></div>
    </div>

    <!-- Status feedback -->
    <div class="status-msg" id="status-msg"></div>

    <!-- Reset -->
    <span class="reset-link" id="reset-link">Upload more photos</span>

    <!-- Gallery link -->
    <a class="gallery-link"
       href="https://drive.google.com/drive/folders/1vUKNqnx5WmxusxlU1k4d4j0EO2pGvo1G"
       target="_blank"
       rel="noopener noreferrer">
      <span class="link-icon" aria-hidden="true">🖼️</span>
      View the Guest Album
    </a>

    <div class="card-footer">
      Thank you for celebrating with Gunner & Perla! 🤍
    </div>
  </div>

  <script>
    // ═══════════════════════════════════════════════════════
    // CONFIGURATION
    // ═══════════════════════════════════════════════════════
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx3smHc0KP5l_1NYHE6Pfwm75NsDNWSLL3bEMdfQQD-HRxHK4oVxcJ3mQTKPiEQXEDBFQ/exec';
    const MAX_IMAGE_DIMENSION = 2048;
    const JPEG_QUALITY = 0.85;

    // ═══════════════════════════════════════════════════════
    // DOM References
    // ═══════════════════════════════════════════════════════
    const selectBtn       = document.getElementById('select-btn');

    const fileInput       = document.getElementById('file-input');
    const previewGrid     = document.getElementById('preview-grid');
    const photoCount      = document.getElementById('photo-count');
    const uploadBtn       = document.getElementById('upload-btn');
    const progressWrapper = document.getElementById('progress-wrapper');
    const progressFill    = document.getElementById('progress-fill');
    const statusMsg       = document.getElementById('status-msg');
    const resetLink       = document.getElementById('reset-link');

    let selectedFiles = []; // Array of File objects

    // ═══════════════════════════════════════════════════════
    // File Selection
    // ═══════════════════════════════════════════════════════
    selectBtn.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', () => {
      if (fileInput.files.length === 0) return;

      // Add new files to the existing selection
      const newFiles = Array.from(fileInput.files);
      selectedFiles = selectedFiles.concat(newFiles);

      renderPreviews();
      statusMsg.classList.remove('visible');
      resetLink.classList.remove('visible');
    });

    function renderPreviews() {
      previewGrid.innerHTML = '';

      selectedFiles.forEach((file, index) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'thumb-wrapper';
        wrapper.dataset.index = index;

        const img = document.createElement('img');
        img.alt = file.name;
        const url = URL.createObjectURL(file);
        img.src = url;
        img.onload = () => URL.revokeObjectURL(url);

        // Remove button
        const removeBtn = document.createElement('button');
        removeBtn.className = 'thumb-remove';
        removeBtn.innerHTML = '✕';
        removeBtn.setAttribute('aria-label', 'Remove ' + file.name);
        removeBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          selectedFiles.splice(index, 1);
          renderPreviews();
        });

        // Status overlay (used during upload)
        const overlay = document.createElement('div');
        overlay.className = 'thumb-overlay';
        overlay.id = 'overlay-' + index;

        wrapper.appendChild(img);
        wrapper.appendChild(removeBtn);
        wrapper.appendChild(overlay);
        previewGrid.appendChild(wrapper);
      });

      const count = selectedFiles.length;
      if (count > 0) {
        previewGrid.classList.add('visible');
        photoCount.classList.add('visible');
        photoCount.textContent = count + (count === 1 ? ' photo selected' : ' photos selected');
        uploadBtn.classList.add('visible');
        uploadBtn.textContent = count === 1 ? 'Upload Photo' : `Upload ${count} Photos`;
        selectBtn.innerHTML = '<span class="btn-icon" aria-hidden="true">➕</span> Add More Photos';

      } else {
        previewGrid.classList.remove('visible');
        photoCount.classList.remove('visible');
        uploadBtn.classList.remove('visible');
        selectBtn.innerHTML = '<span class="btn-icon" aria-hidden="true">📸</span> Choose Photos';

      }

      // Reset the input so the same files can be re-selected if needed
      fileInput.value = '';
    }

    // ═══════════════════════════════════════════════════════
    // Image Resize via Canvas
    // ═══════════════════════════════════════════════════════
    function resizeAndEncode(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;

          if (width > MAX_IMAGE_DIMENSION || height > MAX_IMAGE_DIMENSION) {
            const ratio = Math.min(MAX_IMAGE_DIMENSION / width, MAX_IMAGE_DIMENSION / height);
            width  = Math.round(width * ratio);
            height = Math.round(height * ratio);
          }

          const canvas = document.createElement('canvas');
          canvas.width  = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          const dataUrl = canvas.toDataURL('image/jpeg', JPEG_QUALITY);
          const base64  = dataUrl.split(',')[1];
          URL.revokeObjectURL(img.src);
          resolve(base64);
        };
        img.onerror = () => reject(new Error('Failed to load image.'));
        img.src = URL.createObjectURL(file);
      });
    }

    // ═══════════════════════════════════════════════════════
    // Upload Handler — sequential, one at a time
    // ═══════════════════════════════════════════════════════
    uploadBtn.addEventListener('click', async () => {
      if (selectedFiles.length === 0) return;

      const total = selectedFiles.length;
      let uploaded = 0;
      let failed = 0;

      // Lock UI
      uploadBtn.disabled = true;
      uploadBtn.innerHTML = `<span class="btn-spinner"></span> Uploading 0/${total}…`;
      selectBtn.style.display = 'none';
      progressWrapper.classList.add('visible');
      progressFill.style.width = '0%';
      statusMsg.classList.remove('visible');

      // Hide all remove buttons during upload
      document.querySelectorAll('.thumb-remove').forEach(b => b.style.display = 'none');

      for (let i = 0; i < total; i++) {
        const overlay = document.getElementById('overlay-' + i);

        // Show spinner on this thumbnail
        if (overlay) {
          overlay.innerHTML = '<div class="thumb-spinner"></div>';
          overlay.className = 'thumb-overlay uploading';
        }

        try {
          const base64Data = await resizeAndEncode(selectedFiles[i]);

          const payload = {
            filename: selectedFiles[i].name,
            mimeType: 'image/jpeg',
            data: base64Data
          };

          const response = await fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload),
            redirect: 'follow'
          });

          const result = await response.json();

          if (result.status === 'success') {
            uploaded++;
            if (overlay) {
              overlay.innerHTML = '<span class="overlay-icon">✅</span>';
              overlay.className = 'thumb-overlay done';
            }
          } else {
            failed++;
            if (overlay) {
              overlay.innerHTML = '<span class="overlay-icon">❌</span>';
              overlay.className = 'thumb-overlay failed';
            }
          }
        } catch (err) {
          console.error('Upload failed for', selectedFiles[i].name, err);
          failed++;
          if (overlay) {
            overlay.innerHTML = '<span class="overlay-icon">❌</span>';
            overlay.className = 'thumb-overlay failed';
          }
        }

        // Update progress
        const progress = Math.round(((i + 1) / total) * 100);
        progressFill.style.width = progress + '%';
        uploadBtn.innerHTML = `<span class="btn-spinner"></span> Uploading ${i + 1}/${total}…`;
      }

      // Done
      uploadBtn.classList.remove('visible');
      progressWrapper.classList.remove('visible');

      if (failed === 0) {
        showStatus('success', `✨ ${uploaded} photo${uploaded !== 1 ? 's' : ''} uploaded — thank you!`);
      } else {
        showStatus('error', `${uploaded} uploaded, ${failed} failed — try those again.`);
      }

      resetLink.classList.add('visible');
    });

    // ═══════════════════════════════════════════════════════
    // Status & Reset
    // ═══════════════════════════════════════════════════════
    function showStatus(type, message) {
      statusMsg.className = `status-msg visible ${type}`;
      statusMsg.textContent = message;
    }

    resetLink.addEventListener('click', () => {
      selectedFiles = [];
      fileInput.value = '';
      previewGrid.innerHTML = '';
      previewGrid.classList.remove('visible');
      photoCount.classList.remove('visible');
      uploadBtn.classList.remove('visible');
      uploadBtn.disabled = false;
      uploadBtn.textContent = 'Upload Photos';
      statusMsg.classList.remove('visible');
      resetLink.classList.remove('visible');
      progressWrapper.classList.remove('visible');
      progressFill.style.width = '0%';
      selectBtn.style.display = '';
      selectBtn.innerHTML = '<span class="btn-icon" aria-hidden="true">📸</span> Choose Photos';

    });
  </script>
</body>

</html>
